<div class="product-card" [class.sold-out]="isSoldOut">

  <!-- 商品圖片區 -->
  <div class="card-image-wrapper" [routerLink]="['/market/products', product.productId]"
       style="cursor: pointer;">
    <img [src]="firstImageUrl" [alt]="product.productName" class="card-image" [class.grayscale]="isSoldOut" />

    <!-- 售完遮罩 -->
    @if (isSoldOut) {
    <div class="sold-out-overlay">
      <span class="sold-out-badge">已售完 · 補貨中</span>
    </div>
    }

    <!-- 收藏按鈕 -->
    <button class="favorite-btn" [class.active]="product.isFavorite"
        (click)="onToggleFavorite(); $event.stopPropagation()">
        <i class="pi" [class.pi-heart-fill]="product.isFavorite"
               [class.pi-heart]="!product.isFavorite"></i>
    </button>
  </div>

  <!-- 商品資訊區 -->
  <div class="card-body">
    <div [routerLink]="['/market/products', product.productId]" style="cursor: pointer;">
      <h3 class="product-name">{{ product.productName }}</h3>
      <p class="product-brand">{{ product.brandOrOrigin }}</p>
    </div>

    <div class="card-footer">
      <span class="product-price">NT$ {{ product.price | number }}</span>

      @if (product.isOwnProduct) {
        <!-- 自己賣場的商品：不能購買 -->
        <span class="own-product-tag">
          <i class="pi pi-shop"></i> 你的商品
        </span>
        } @else if (!isSoldOut) {
        <!-- 1. 正常商品：加入購物車 -->
        <p-button label="加入購物車" icon="pi pi-shopping-cart" size="small" (onClick)="onAddToCart()" />
        } @else {
        <!-- 2. 售完商品：到貨通知 -->
        <p-button label="到貨通知我" icon="pi pi-bell" size="small" severity="secondary" [outlined]="true" />
        }
    </div>
  </div>
</div>
