<aside class="sellcenter-sidebar">

  <!-- 點 Logo 回到商品管理 -->
  <a class="sidebar-brand" routerLink="/sellcenter/products">
    <div class="brand-icon"><i class="pi pi-shop"></i></div>
    <div>
      <div class="brand-title">友料賣家中心</div>
      <div class="brand-sub">SELLER HUB PRO</div>
    </div>
  </a>

  <div class="seller-info">
    @if (authService.currentUser()?.userImage) {
      <img [src]="authService.currentUser()?.userImage" alt="賣家頭像" class="seller-avatar" />
    } @else {
      <span class="seller-avatar seller-avatar-fallback"><i class="pi pi-shop"></i></span>
    }
    <div>
      <div class="seller-name">{{ sellerState.sellerInfo()?.sellerName }}</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    @for (item of navItems(); track item.route) {
    <a [routerLink]="item.route" routerLinkActive="active" class="nav-item">
      <span class="nav-left">
        <i [class]="item.icon"></i>
        {{ item.label }}
      </span>
      @if (item.badge) {
      <span [class]="'nav-badge ' + (item.badgeClass || '')">
        {{ item.badge }}
      </span>
      }
    </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a href="#" class="footer-link">
      <i class="pi pi-external-link"></i>瀏覽我的賣場公開頁
    </a>
  </div>

</aside>
