<header class="sellcenter-header">

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <span class="bc-root">賣家工作台</span>
    <span class="bc-sep">/</span>
    <span class="bc-current">{{ currentPage }}</span>
  </div>

  <!-- 右側工具列 -->
  <div class="header-tools">

    <div class="divider"></div>

    <div class="icon-btns">
      <button class="icon-btn">
        <i class="pi pi-bell"></i>
      </button>
      <button class="icon-btn">
        <i class="pi pi-comments"></i>
      </button>
    </div>

    <div class="divider"></div>

    <div class="user-chip">
  <!-- 頭像 + 名字：導到會員中心 -->
  <a class="user-profile-link" routerLink="/main">
    @if (authService.currentUser()?.userImage) {
    <img [src]="getUserImage(authService.currentUser()?.userImage)" (error)="onAvatarError($event)"
      class="user-avatar" alt="賣家頭像" />
    } @else {
    <i class="pi pi-user user-chip-fallback"></i>
    }
    <span>{{ sellerState.sellerInfo()?.ownerName || sellerState.sellerInfo()?.sellerName }}</span>
  </a>

  <!-- 下箭頭：開啟登出選單 -->
  <button type="button" class="user-menu-btn" aria-label="開啟使用者選單" (click)="userMenu.toggle($event)">
    <i class="pi pi-chevron-down"></i>
  </button>
  <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body" />
</div>
  </div>

</header>
