<header class="topbar">
  <a class="brand" routerLink="/recipes" aria-label="友料美食生活平台首頁">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" role="img">
        <path d="M9 3v10M6 3v6c0 2 1.3 4 3 4s3-2 3-4V3M9 13v16M22 3c-3 4-4 8-4 12h4v14M22 3v12" />
      </svg>
    </span>
    <span>
      友料美食生活平台
      <small>FriendlyFood</small>
    </span>
  </a>

  <button type="button" class="mobile-navigation-button" aria-label="切換主要導覽"
    [attr.aria-expanded]="isMobileNavigationOpen()" (click)="toggleMobileNavigation()">
    <i class="pi" [class.pi-bars]="!isMobileNavigationOpen()" [class.pi-times]="isMobileNavigationOpen()"></i>
  </button>

  <nav aria-label="主要導覽" [class.open]="isMobileNavigationOpen()">
    <a routerLink="/recipes" routerLinkActive="active">
      <i class="pi pi-compass"></i>
      食譜發現
    </a>
    <a routerLink="/pantry" routerLinkActive="active">
      <i class="pi pi-box"></i>
      智慧清冰箱
    </a>
    <a routerLink="/create" routerLinkActive="active">
      <i class="pi pi-pencil"></i>
      發布食譜
    </a>
    <span class="navigation-divider" aria-hidden="true"></span>
    <a routerLink="/market/create-product" routerLinkActive="active">友善商城</a>
    <a routerLink="/forum" routerLinkActive="active">討論區</a>
    <a routerLink="/nearby-place" routerLinkActive="active">美食地圖</a>
  </nav>
</header>

<main class="app-content">
  <router-outlet />
</main>

<footer class="footer p-4 md:p-8">
  <div>
    <strong>友料美食生活平台．SMART COOKING &amp; RECIPE HUB</strong>
    <p>讓每一次料理都更智慧、更永續，從妥善使用冰箱裡的每一份食材開始。</p>
  </div>
  <small>© 2026 友料美食生活平台 All Rights Reserved.</small>
</footer>
