<div class="login-page">
  <div class="login-container">
    <p-card styleClass="login-card">
      <!-- 標題 -->
      <div class="login-header">
        <h1>歡迎回來</h1>
        <p>登入 FriendlyFood 開始探索美食</p>
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <!-- 帳號 -->
        <div class="form-field">
          <label for="username"> 帳號 </label>

          <input
            pInputText
            id="username"
            name="username"
            type="text"
            placeholder="請輸入帳號"
            [(ngModel)]="loginData.username"
            #username="ngModel"
            required
            autocomplete="username"
            class="full-width"
          />

          @if (username.invalid && username.touched) {
            <small class="field-error"> 請輸入帳號 </small>
          }
        </div>

        <!-- 密碼 -->
        <div class="form-field">
          <div class="password-label">
            <label for="password"> 密碼 </label>

            <a routerLink="/forgot-password" class="link"> 忘記密碼？ </a>
          </div>

          <p-password
            inputId="password"
            name="password"
            [(ngModel)]="loginData.password"
            #password="ngModel"
            placeholder="請輸入密碼"
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="current-password"
            styleClass="full-width"
            inputStyleClass="full-width"
            required
          >
          </p-password>

          @if (password.invalid && password.touched) {
            <small class="field-error"> 請輸入密碼 </small>
          }
        </div>

        <!-- API 錯誤 -->
        @if (errorMessage) {
          <p-message severity="error" [text]="errorMessage" styleClass="error-message"> </p-message>
        }

        <!-- 登入 -->
        <p-button
          type="submit"
          label="登入"
          icon="pi pi-sign-in"
          [disabled]="loginForm.invalid"
          styleClass="login-button"
        >
        </p-button>
        <div class="login-divider">
          <span>或</span>
        </div>

        <!-- Google 會把按鈕畫在這裡 -->
        <div class="google-login">
          <div id="googleButton"></div>
        </div>
      </form>

      <!-- 註冊 -->
      <div class="register-section">
        <span>還沒有帳號？</span>

        <a routerLink="/register" class="link"> 註冊會員 </a>
      </div>
    </p-card>
  </div>
</div>
